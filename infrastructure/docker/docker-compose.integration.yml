services:
  postgres-integration:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: restaurant_ai_integration_test
      POSTGRES_USER: restaurant_ai_test
      POSTGRES_PASSWORD: restaurant_ai_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
