services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: restaurant-ai-phoenix
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  phoenix_data:
    name: restaurant-ai-phoenix-data
